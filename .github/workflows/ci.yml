name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all modules
        run: python -m compileall -q server.py providers.py compose.py local_image.py local_llm.py local_tts.py download_models.py check_ark.py

      - name: Import and config self-check
        run: |
          python - <<'PY'
          import json, providers, compose, server
          status = providers.config_status()
          print("mode:", status["mode"])
          print("llm:", status["llm"]["backend"], "| image:", status["image"]["backend"], "| tts:", status["tts"]["backend"])
          assert providers.resolve_voice("旁白")["voice"]
          assert providers.resolve_voice("任意角色名")["voice"]
          assert "scenes" in providers.gen_storyboard("测试故事：少年在山顶遇见一只白狐。", "仙侠玄幻·唯美写实", 2)
          print("self-check OK")
          PY

      - name: Warn on committed secrets
        run: |
          if grep -rn --include="*.json" -E '"(api_key)"\s*:\s*"[A-Za-z0-9_-]{20,}"' . ; then
            echo "::error::配置文件里疑似有真实 API Key，请移除后再提交"
            exit 1
          fi
          echo "no hardcoded keys"
